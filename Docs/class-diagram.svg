<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 34px Arial,sans-serif;fill:#111827}
      .subtitle{font:400 18px Arial,sans-serif;fill:#475569}
      .group{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:10}
      .groupTitle{font:700 22px Arial,sans-serif;fill:#0f172a}
      .box{fill:#fff;stroke:#334155;stroke-width:1.6;rx:6}
      .boxModel{fill:#eef6ff}
      .boxView{fill:#ecfdf5}
      .boxController{fill:#fff7ed}
      .boxData{fill:#f5f3ff}
      .className{font:700 15px Arial,sans-serif;fill:#111827}
      .text{font:12px Consolas,monospace;fill:#1f2937}
      .rel{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .inherit{stroke:#0f766e;stroke-width:2.2;fill:none;marker-end:url(#triangle)}
      .label{font:12px Arial,sans-serif;fill:#334155}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f8fafc" stroke="#0f766e" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1320"/>
  <text class="title" x="50" y="58">CoffeeWMS - OOP Class Diagram</text>
  <text class="subtitle" x="50" y="88">Ringkasan class, atribut utama, method utama, dan relasi MVC/Model pada folder CoffeeWMS.</text>

  <rect class="group" x="40" y="125" width="520" height="1015"/>
  <text class="groupTitle" x="65" y="162">Models</text>

  <rect class="box boxModel" x="65" y="185" width="220" height="132"/><text class="className" x="80" y="207">User</text><line x1="65" y1="216" x2="285" y2="216" stroke="#94a3b8"/><text class="text" x="80" y="235">+ UserId, Username</text><text class="text" x="80" y="252">+ Password, IsActive</text><text class="text" x="80" y="269">+ CreatedAt</text><text class="text" x="80" y="286">+ RolesString</text><text class="text" x="80" y="303">+ Roles: List&lt;Role&gt;</text>
  <rect class="box boxModel" x="315" y="185" width="210" height="98"/><text class="className" x="330" y="207">Role</text><line x1="315" y1="216" x2="525" y2="216" stroke="#94a3b8"/><text class="text" x="330" y="235">+ RoleId</text><text class="text" x="330" y="252">+ RoleName</text><text class="text" x="330" y="269">+ Description</text>
  <rect class="box boxModel" x="315" y="305" width="210" height="115"/><text class="className" x="330" y="327">Session</text><line x1="315" y1="336" x2="525" y2="336" stroke="#94a3b8"/><text class="text" x="330" y="355">+ CurrentUser</text><text class="text" x="330" y="372">+ IsAdmin</text><text class="text" x="330" y="389">+ IsManager</text><text class="text" x="330" y="406">+ IsPetugas</text>
  <rect class="box boxModel" x="65" y="340" width="220" height="115"/><text class="className" x="80" y="362">Supplier</text><line x1="65" y1="371" x2="285" y2="371" stroke="#94a3b8"/><text class="text" x="80" y="390">+ SupplierId</text><text class="text" x="80" y="407">+ CompanyName</text><text class="text" x="80" y="424">+ Address, Phone</text><text class="text" x="80" y="441">+ IsActive</text>
  <rect class="box boxModel" x="315" y="445" width="210" height="98"/><text class="className" x="330" y="467">Destination</text><line x1="315" y1="476" x2="525" y2="476" stroke="#94a3b8"/><text class="text" x="330" y="495">+ DestinationId</text><text class="text" x="330" y="512">+ DestinationName</text><text class="text" x="330" y="529">+ Address, IsActive</text>
  <rect class="box boxModel" x="65" y="480" width="220" height="166"/><text class="className" x="80" y="502">CoffeeProduct</text><line x1="65" y1="511" x2="285" y2="511" stroke="#94a3b8"/><text class="text" x="80" y="530">+ ProductId</text><text class="text" x="80" y="547">+ CoffeeName</text><text class="text" x="80" y="564">+ CategoryId/Name</text><text class="text" x="80" y="581">+ OriginId/Name</text><text class="text" x="80" y="598">+ CurrentQuantity</text><text class="text" x="80" y="615">+ MinimumStock</text><text class="text" x="80" y="632">+ RoastLevelId/Name</text>
  <rect class="box boxModel" x="315" y="565" width="210" height="98"/><text class="className" x="330" y="587">CoffeeType</text><line x1="315" y1="596" x2="525" y2="596" stroke="#94a3b8"/><text class="text" x="330" y="615">+ CoffeeId</text><text class="text" x="330" y="632">+ CoffeeName</text><text class="text" x="330" y="649">+ IsActive</text>
  <rect class="box boxModel" x="65" y="675" width="220" height="98"/><text class="className" x="80" y="697">CoffeeCategory</text><line x1="65" y1="706" x2="285" y2="706" stroke="#94a3b8"/><text class="text" x="80" y="725">+ CategoryId</text><text class="text" x="80" y="742">+ CategoryName</text><text class="text" x="80" y="759">+ Description</text>
  <rect class="box boxModel" x="315" y="690" width="210" height="115"/><text class="className" x="330" y="712">CoffeeOrigin</text><line x1="315" y1="721" x2="525" y2="721" stroke="#94a3b8"/><text class="text" x="330" y="740">+ OriginId</text><text class="text" x="330" y="757">+ OriginName</text><text class="text" x="330" y="774">+ Region</text><text class="text" x="330" y="791">+ Description, IsActive</text>
  <rect class="box boxModel" x="65" y="805" width="220" height="115"/><text class="className" x="80" y="827">RoastLevel</text><line x1="65" y1="836" x2="285" y2="836" stroke="#94a3b8"/><text class="text" x="80" y="855">+ RoastLevelId</text><text class="text" x="80" y="872">+ RoastLevelName</text><text class="text" x="80" y="889">+ Description</text><text class="text" x="80" y="906">+ IsActive</text>
  <rect class="box boxModel" x="315" y="835" width="210" height="98"/><text class="className" x="330" y="857">LogEntry</text><line x1="315" y1="866" x2="525" y2="866" stroke="#94a3b8"/><text class="text" x="330" y="885">+ LogId, Actor</text><text class="text" x="330" y="902">+ Action, Description</text><text class="text" x="330" y="919">+ LogTime</text>
  <rect class="box boxModel" x="65" y="950" width="220" height="132"/><text class="className" x="80" y="972">Report/Helper Models</text><line x1="65" y1="981" x2="285" y2="981" stroke="#94a3b8"/><text class="text" x="80" y="1000">DropdownItem</text><text class="text" x="80" y="1017">LaporanPenerimaanItem</text><text class="text" x="80" y="1034">LaporanPengirimanItem</text><text class="text" x="80" y="1051">StockSummary</text><text class="text" x="80" y="1068">DashboardSummary</text>

  <rect class="group" x="610" y="125" width="520" height="1015"/>
  <text class="groupTitle" x="635" y="162">Views</text>
  <rect class="box boxView" x="635" y="185" width="220" height="115"/><text class="className" x="650" y="207">BaseForm : Form</text><line x1="635" y1="216" x2="855" y2="216" stroke="#94a3b8"/><text class="text" x="650" y="235">+ pnlSidebar/Header</text><text class="text" x="650" y="252">+ pnlContent</text><text class="text" x="650" y="269">+ LoadView()</text>
