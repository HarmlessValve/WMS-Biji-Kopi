  <rect class="box boxView" x="885" y="500" width="210" height="115"/><text class="className" x="900" y="522">AdminDashboardForm</text><line x1="885" y1="531" x2="1095" y2="531" stroke="#94a3b8"/><text class="text" x="900" y="550">+ LoadDashboardReq.</text><text class="text" x="900" y="567">+ DisplayLogs()</text><text class="text" x="900" y="584">+ DisplaySuppliers()</text><text class="text" x="900" y="601">+ DisplayDestinations()</text>
  <rect class="box boxView" x="635" y="665" width="220" height="115"/><text class="className" x="650" y="687">PetugasDashboardForm</text><line x1="635" y1="696" x2="855" y2="696" stroke="#94a3b8"/><text class="text" x="650" y="715">+ LoadDashboardReq.</text><text class="text" x="650" y="732">+ DisplaySummary()</text><text class="text" x="650" y="749">+ DisplayStokKopi()</text>
  <rect class="box boxView" x="885" y="650" width="210" height="132"/><text class="className" x="900" y="672">PenerimaanView</text><line x1="885" y1="681" x2="1095" y2="681" stroke="#94a3b8"/><text class="text" x="900" y="700">- _controller</text><text class="text" x="900" y="717">- LoadInitialData()</text><text class="text" x="900" y="734">- LoadKategori()</text><text class="text" x="900" y="751">- BtnSimpan_Click()</text><text class="text" x="900" y="768">- RefreshGrid()</text>
  <rect class="box boxView" x="635" y="810" width="220" height="132"/><text class="className" x="650" y="832">PengirimanView</text><line x1="635" y1="841" x2="855" y2="841" stroke="#94a3b8"/><text class="text" x="650" y="860">- _controller</text><text class="text" x="650" y="877">- LoadInitialData()</text><text class="text" x="650" y="894">- LoadKategori()</text><text class="text" x="650" y="911">- BtnSimpan_Click()</text><text class="text" x="650" y="928">- RefreshGrid()</text>
  <rect class="box boxView" x="885" y="815" width="210" height="115"/><text class="className" x="900" y="837">LaporanView</text><line x1="885" y1="846" x2="1095" y2="846" stroke="#94a3b8"/><text class="text" x="900" y="865">- _controller</text><text class="text" x="900" y="882">- LoadSummary()</text><text class="text" x="900" y="899">- LoadLaporan()</text><text class="text" x="900" y="916">- ApplyGridStyle()</text>
